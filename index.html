<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogo sfogliabile</title>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
          type="module"></script>

  <!-- StPageFlip -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #18231f;
    }

    .viewer {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 55px 20px 75px;
    }

    #book {
      width: min(92vw, 1100px);
      height: min(78vh, 780px);
    }

    .controls {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 20;
      background: rgba(0,0,0,.42);
      backdrop-filter: blur(8px);
      padding: 8px 12px;
      border-radius: 30px;
    }

    button {
      border: 0;
      background: #fff;
      color: #18231f;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      transition: transform .15s, opacity .15s;
    }

    button:hover { transform: scale(1.06); }
    button:disabled { opacity: .35; cursor: default; }

    #counter {
      color: #fff;
      min-width: 75px;
      text-align: center;
      font-size: 14px;
    }

    .title {
      position: fixed;
      top: 17px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 14px;
      letter-spacing: .08em;
      opacity: .9;
      z-index: 20;
    }

    .loading {
      color: white;
      text-align: center;
      font-size: 16px;
    }

    .error {
      max-width: 600px;
      padding: 25px;
      border-radius: 12px;
      background: white;
      color: #222;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 700px) {
      .viewer { padding: 45px 8px 70px; }
      #book {
        width: 96vw;
        height: 78vh;
      }
      .title { font-size: 11px; }
    }
  </style>
</head>

<body>
  <div class="title">CATALOGO</div>

  <main class="viewer">
    <div id="book">
      <div class="loading">Caricamento catalogo…</div>
    </div>
  </main>

  <div class="controls">
    <button id="prev" aria-label="Pagina precedente">‹</button>
    <span id="counter">1 / …</span>
    <button id="next" aria-label="Pagina successiva">›</button>
  </div>

<script type="module">
  import * as pdfjsLib from
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

  const PDF_FILE = "brochure.pdf";

  const book = document.getElementById("book");
  const counter = document.getElementById("counter");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");

  async function createBook() {
    try {
      const pdf = await pdfjsLib.getDocument(PDF_FILE).promise;

      book.innerHTML = "";

      const pages = [];

      // Renderizza ogni pagina del PDF come immagine/canvas.
      // Scale 1.6 = buona qualità senza file HTML enormi.
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 1.6 });

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        await page.render({
          canvasContext: ctx,
          viewport: viewport
        }).promise;

        const pageDiv = document.createElement("div");
        pageDiv.className = "page";
        pageDiv.style.background = "#fff";
        pageDiv.appendChild(canvas);

        pages.push(pageDiv);
      }

      pages.forEach(p => book.appendChild(p));

      const pageFlip = new St.PageFlip(book, {
        width: pages[0].querySelector("canvas").width,
        height: pages[0].querySelector("canvas").height,

        size: "stretch",
        minWidth: 280,
        maxWidth: 900,
        minHeight: 400,
        maxHeight: 1200,

        showCover: true,
        mobileScrollSupport: false,
        maxShadowOpacity: 0.35,
        flippingTime: 650,
        usePortrait: true
      });

      pageFlip.loadFromHTML(pages);

      function updateControls() {
        const current = pageFlip.getCurrentPageIndex() + 1;
        const total = pdf.numPages;

        counter.textContent = `${current} / ${total}`;
        prev.disabled = pageFlip.getCurrentPageIndex() <= 0;
        next.disabled = pageFlip.getCurrentPageIndex() >= total - 1;
      }

      pageFlip.on("flip", updateControls);
      updateControls();

      prev.addEventListener("click", () => pageFlip.flipPrev());
      next.addEventListener("click", () => pageFlip.flipNext());

      // Frecce della tastiera
      document.addEventListener("keydown", e => {
        if (e.key === "ArrowLeft") pageFlip.flipPrev();
        if (e.key === "ArrowRight") pageFlip.flipNext();
      });

    } catch (error) {
      console.error(error);
      book.innerHTML = `
        <div class="error">
          <strong>Impossibile caricare il catalogo.</strong><br><br>
          Controlla che il file si chiami esattamente
          <strong>brochure.pdf</strong> e che si trovi nella stessa
          cartella di questo file HTML.
        </div>`;
    }
  }

  createBook();
</script>
</body>
</html>
