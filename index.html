<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brochure</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#202020;font-family:Arial,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
header{
  height:58px;flex:0 0 58px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:20px;letter-spacing:.5px;
  background:#181818
}
.viewer{
  position:relative;flex:1;min-height:0;
  display:flex;align-items:center;justify-content:center;
  padding:10px 55px
}
iframe{
  width:100%;height:100%;border:0;background:#fff;
}
button{
  position:absolute;top:50%;transform:translateY(-50%);
  width:44px;height:64px;border:0;border-radius:8px;
  background:rgba(0,0,0,.55);color:#fff;
  font-size:38px;line-height:1;cursor:pointer;
  z-index:5
}
button:hover{background:rgba(0,0,0,.75)}
#prev{left:8px}
#next{right:8px}
footer{
  height:42px;flex:0 0 42px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;background:#181818;font-size:13px
}
@media(max-width:600px){
  header{height:48px;flex-basis:48px;font-size:17px}
  .viewer{padding:5px 43px}
  button{width:36px;height:54px;font-size:30px}
  #prev{left:4px}#next{right:4px}
  footer{height:36px;flex-basis:36px}
}
</style>
</head>

<body>

<header>Brochure</header>

<div class="viewer">
  <button id="prev" aria-label="Pagina precedente">‹</button>

  <iframe
    id="pdf"
    src="brochure.pdf#page=1&view=Fit"
    title="Brochure">
  </iframe>

  <button id="next" aria-label="Pagina successiva">›</button>
</div>

<footer>
  <span id="counter">Pagina 1 / 13</span>
</footer>

<script>
const totalPages = 13;
let page = 1;

const pdf = document.getElementById("pdf");
const counter = document.getElementById("counter");

function showPage(n){
  if(n < 1 || n > totalPages) return;
  page = n;
  pdf.src = "brochure.pdf#page=" + page + "&view=Fit";
  counter.textContent = "Pagina " + page + " / " + totalPages;
}

document.getElementById("prev").onclick = () => showPage(page - 1);
document.getElementById("next").onclick = () => showPage(page + 1);

document.addEventListener("keydown", e => {
  if(e.key === "ArrowLeft") showPage(page - 1);
  if(e.key === "ArrowRight") showPage(page + 1);
});
</script>

</body>
</html>
