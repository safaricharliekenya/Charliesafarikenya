<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Safari Charlie — Brochure</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="viewer" aria-label="Catalogo Safari Charlie">
  <div class="book">
    <div class="page-wrap">
      <img id="page" class="page" src="pages/pagina-1.jpg" alt="Pagina 1 della brochure">
      <div id="flash" class="flash"></div>
    </div>
  </div>

  <button class="nav prev" id="prev" aria-label="Pagina precedente">‹</button>
  <button class="nav next" id="next" aria-label="Pagina successiva">›</button>

  <div class="controls">
    <button id="fullscreen" class="control">⛶</button>
    <span id="counter">1 / 13</span>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
